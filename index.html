<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>少年 AI 第一课 · 学员闯关小测试</title>
<style>
:root{--primary:#2575fc;--primary-deep:#0d47a1;--purple:#6a11cb;--accent:#ff6b35;--bg:#f5f7fb;--card:#fff;--text:#1f2937;--text-soft:#4b5563;--text-mute:#6b7280;--border:#e5e7eb;--success:#10b981;--success-soft:#d1fae5;--error:#ef4444;--error-soft:#fee2e2;--warn:#f59e0b;--shadow:0 6px 20px rgba(15,40,90,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.container{max-width:820px;margin:0 auto;padding:0 18px}
.hero{background:linear-gradient(135deg,#6a11cb 0%,#2575fc 100%);color:#fff;padding:44px 0 34px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:-70px;left:-70px;width:250px;height:250px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);border-radius:50%}
.hero:after{content:"";position:absolute;right:-80px;bottom:-90px;width:290px;height:290px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);border-radius:50%}
.hero .container{position:relative;z-index:1}
.hero-tag{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:999px;font-size:12px;letter-spacing:1px;margin-bottom:14px}
.hero h1{font-size:30px;font-weight:800;margin-bottom:10px;letter-spacing:-.5px}
.hero .subtitle{font-size:15px;opacity:.94;max-width:560px;margin:0 auto}
.hero-stats{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-pack:center;-ms-flex-pack:center;justify-content:center;gap:12px;margin-top:22px;-ms-flex-wrap:wrap;flex-wrap:wrap}
.hero-stats .stat{background:rgba(255,255,255,.15);padding:8px 16px;border-radius:10px;font-size:14px}
.hero-stats .stat b{color:#ffe082;font-weight:800}
.progress-wrap{background:rgba(255,255,255,.96);padding:16px 0;position:-webkit-sticky;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.progress-bar{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#6a11cb,#2575fc);border-radius:999px;transition:width .35s ease}
.progress-text{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-ms-flex-pack:justify;justify-content:space-between;font-size:13px;color:var(--text-mute)}
.intro-card,.quiz-card,.result-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
.intro-card{padding:20px;margin:22px 0 0;background:linear-gradient(135deg,#fff 0%,#f8faff 100%)}
.intro-card h3{color:var(--primary-deep);font-size:16px;margin-bottom:8px}
.intro-card p{font-size:14px;color:var(--text-soft)}
.quiz-card{padding:24px;margin-top:22px;display:none}
.quiz-card.active{display:block;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:-webkit-box;display:-ms-flexbox;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.q-num{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;font-size:13px;padding:4px 12px;border-radius:7px;font-weight:700}
.q-type{font-size:12px;color:var(--text-mute);background:#f3f4f6;padding:4px 10px;border-radius:7px}
.q-text{font-size:18px;font-weight:700;color:var(--text);margin-bottom:18px;line-height:1.6}
.multi-hint{background:#fff3e0;border-left:3px solid var(--warn);padding:8px 14px;border-radius:7px;font-size:13px;color:#92400e;margin-bottom:14px}
.options{display:-webkit-box;display:-ms-flexbox;display:flex;-webkit-box-orient:vertical;-webkit-box-direction:normal;-ms-flex-direction:column;flex-direction:column;gap:10px}
.option{background:#f9fafb;border:2px solid var(--border);border-radius:12px;padding:14px 15px;cursor:pointer;transition:all .18s;display:-webkit-box;display:-ms-flexbox;display:flex;align-items:center;gap:12px;user-select:none;-webkit-user-select:none}
.option:active{transform:scale(.99)}
.option.selected{border-color:var(--primary);background:#eaf3ff}
.option.correct{border-color:var(--success);background:var(--success-soft)}
.option.wrong{border-color:var(--error);background:var(--error-soft)}
.opt-label{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--border);display:-webkit-box;display:-ms-flexbox;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text-soft)}
.option.selected .opt-label{background:var(--primary);color:#fff;border-color:var(--primary)}
.option.correct .opt-label{background:var(--success);color:#fff;border-color:var(--success)}
.option.wrong .opt-label{background:var(--error);color:#fff;border-color:var(--error)}
.opt-text{flex:1;font-size:15px;color:var(--text)}
.option.disabled{cursor:default;opacity:.86}
.explain{margin-top:18px;padding:16px;background:#f0f7ff;border-radius:12px;border-left:4px solid var(--primary);display:none}
.explain.show{display:block;animation:fadeIn .25s}
.ex-title{font-weight:800;color:var(--primary-deep);margin-bottom:6px;font-size:14px}
.ex-text{font-size:14px;color:var(--text-soft)}
.ex-tip{margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1;font-size:13px;color:var(--text-mute);font-style:italic}
.btn-row,.result-actions{display:-webkit-box;display:-ms-flexbox;display:flex;gap:12px;margin-top:22px}
.btn-row{justify-content:space-between}
.btn{padding:11px 20px;border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;min-height:44px}
.btn-primary{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff}
.btn-primary:disabled,.btn-secondary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:#f3f4f6;color:var(--text-soft)}
.result-card{padding:34px 22px;text-align:center;display:none;margin-top:24px}
.result-card.show{display:block;animation:fadeIn .32s ease}
.result-emoji{font-size:60px;margin-bottom:12px}
.result-title{font-size:26px;font-weight:900;margin-bottom:8px}
.result-score{font-size:48px;font-weight:900;background:linear-gradient(135deg,#6a11cb,#2575fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:12px 0}
.result-score small{font-size:19px;color:var(--text-mute);-webkit-text-fill-color:var(--text-mute)}
.result-msg{color:var(--text-soft);font-size:15px;max-width:560px;margin:0 auto 20px}
.result-badges{display:-webkit-box;display:-ms-flexbox;display:flex;-ms-flex-wrap:wrap;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.badge{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800}
.badge.gold{background:#fef3c7;color:#92400e}.badge.silver{background:#e5e7eb;color:#374151}.badge.bronze{background:#fed7aa;color:#9a3412}
.result-actions{justify-content:center;flex-wrap:wrap}
.review-panel{display:none;margin-top:18px;text-align:left;background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:16px}
.review-panel.show{display:block}
.review-item{padding:14px 0;border-bottom:1px dashed #d1d5db}
.review-item:last-child{border-bottom:0}
.review-item h4{font-size:15px;margin-bottom:8px;color:var(--primary-deep)}
.review-item p{font-size:14px;color:var(--text-soft);margin-top:6px}
.answer-line{font-size:13px;color:#047857;background:#ecfdf5;border-radius:8px;padding:6px 10px;margin-top:8px}
.safe-tip{margin:20px 0 0;color:#94a3b8;font-size:12px;text-align:center}
@media(max-width:600px){.container{padding:0 14px}.hero{padding:38px 0 30px}.hero h1{font-size:24px}.hero .subtitle{font-size:14px}.hero-stats .stat{font-size:12px;padding:7px 12px}.progress-text{font-size:12px}.q-text{font-size:16px}.quiz-card{padding:20px 16px}.btn{padding:10px 14px;font-size:14px}.result-score{font-size:42px}}
@media print{.progress-wrap,.btn-row,.result-actions{display:none}.quiz-card,.result-card,.intro-card{box-shadow:none;break-inside:avoid}.quiz-card{display:block}body{background:#fff}}
</style>
</head>
<body>
<header class="hero"><div class="container"><span class="hero-tag">少年 AI 第一课 · 学员闯关</span><h1>🚀 你对 AI 知多少？</h1><p class="subtitle">10 道趣味 AI 题，测一测你离“AI 小达人”还有多远。<br>答完看看你是不是营地最懂 AI 的那个少年！</p><div class="hero-stats"><div class="stat">📝 共 <b>10</b> 题</div><div class="stat">⏱ 约 <b>5</b> 分钟</div><div class="stat">🎯 满分 <b>100</b> 分</div></div></div></header>
<div class="progress-wrap"><div class="container"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text"><span id="progressLabel">第 1 题 / 共 10 题</span><span id="scoreLabel">当前得分：0 分</span></div></div></div>
<main class="container"><div class="intro-card"><h3>👋 测试说明</h3><p>• 单选题：选 1 个最准确的答案；多选题：选所有正确答案<br>• 每题答完会立即显示解析，可以边做边学<br>• 这是可离线打开的单文件 H5 版，不依赖外部图片、字体或脚本</p></div><div id="quizContainer"></div><div class="result-card" id="resultCard"><div class="result-emoji" id="resultEmoji">🎉</div><div class="result-title" id="resultTitle">测试完成！</div><div class="result-score"><span id="finalScore">0</span><small> / 100 分</small></div><div class="result-msg" id="resultMsg"></div><div class="result-badges" id="resultBadges"></div><div class="result-actions"><button class="btn btn-primary" id="restartBtn">🔄 再测一次</button><button class="btn btn-secondary" id="reviewBtn">📖 查看所有解析</button></div><div class="review-panel" id="reviewPanel"></div></div><p class="safe-tip">2026 核桃编程 AI 实训营 · 学员闯关小测试</p></main>
<script>
var questions = [{"type":"单选","q":"下面哪一个最准确地描述了\"AI\"（人工智能）？","options":["AI 就是会动的机器，比如遥控汽车","AI 是让机器像人一样去学习、思考、判断和创造的学问","AI 就是手机里的计算器","AI 是只能在电影里出现的科幻概念"],"answer":[1],"explain":"AI（Artificial Intelligence，人工智能）的核心是让机器具备\"学习、推理、感知、决策\"等本来属于人类智能的能力。遥控汽车能动但不会学习；计算器只会算不会想；AI 早已走出科幻电影，进入我们每天的生活。","tip":"在营地 DAY 1 威盛科学馆，你会亲手感受 AI 是怎么\"学习\"的。"},{"type":"单选","q":"ChatGPT、DeepSeek、文心一言、星火大模型……这些工具都属于哪一类 AI？","options":["大模型（Large Language Model，LLM）","计算器","搜索引擎","杀毒软件"],"answer":[0],"explain":"这些都是\"大语言模型\"（LLM）的代表产品。大模型通过阅读海量文本，学会理解和生成人类语言，所以能和你聊天、写文章、做创意——DAY1 你会实操 DeepSeek，DAY3 你会走进科大讯飞玩星火大模型。","tip":"大模型是 AI 营地\"全链路认知\"的核心一站。"},{"type":"单选","q":"下面哪个不是 AI 在我们生活中的真实应用？","options":["手机里的语音助手（Siri、小爱同学）","短视频 App 推荐你爱看的内容","自动驾驶汽车识别红绿灯和行人","把水烧开用的电水壶"],"answer":[3],"explain":"前三个都是 AI 的真实应用：语音识别、推荐算法、计算机视觉。电水壶靠的是简单的物理温控开关，不需要\"学习\"和\"判断\"，不属于 AI。","tip":"DAY2 北科大，你会看到 AI 自动驾驶是怎么\"看路\"的。"},{"type":"单选","q":"下面关于\"用 AI 写作业\"哪个说法最聪明？","options":["把题目直接丢给 AI，把答案抄上去就行","用 AI 帮我理解题目、讲解思路，再自己思考一遍","用 AI 越多越好，不用动脑子","AI 永远是对的，照着做就行"],"answer":[1],"explain":"营地要教的核心技能叫\"慧用 AI\"——把 AI 当学习伙伴，而不是答案搜索引擎。直接抄答案 = 越用越懒；让 AI 帮你理解思路、再自己消化 = 越用越强。AI 也会出错，必须带着自己的判断去用。","tip":"DAY4 北师大的\"大咖对话\"会专门聊 AI 价值观。"},{"type":"单选","q":"营地 DAY2 你会接触到的\"四足机器狗\"，它属于 AI 的哪个方向？","options":["具身智能（Embodied AI）—— AI 有了身体，能在真实世界里行动","只是个玩具，跟 AI 没关系","纯文字 AI，只能聊天","计算器的一种"],"answer":[0],"explain":"机器狗是\"具身智能\"的代表——AI 不再只活在屏幕里，而是装进了机器人的身体，能在真实环境里走路、避障、救援。营地 6 天打通的就是\"AI 芯片 → 大模型 → 具身机器人\"的完整链路。","tip":"DAY2 你会给四足机器狗编程，让它完成搜救任务。"},{"type":"多选","q":"这次 AI 营地，你会去哪些\"硬核科技现场\"？（多选）","options":["威盛未来科学馆（光刻机、AI 自动驾驶、DeepSeek 实操）","北京科技大学（ChatGPT 绘画、数字人、无人机、机器狗）","科大讯飞实验室（星火大模型、AI 职业规划、语音飞船）","北京师范大学（AI 自动化养龙虾 + AI 价值观）"],"answer":[0,1,2,3],"explain":"全选才是对的！6 天走进 5 大硬核科技现场：威盛科学馆、北科大、机器人基地、科大讯飞、北师大。这就是\"AI 全链路认知\"——从芯片到大模型到机器人，全摸一遍。","tip":"整个营地最特别的，就是去\"真实科技现场\"做真东西，而不是在教室里看视频。"},{"type":"单选","q":"什么是\"AI 大模型\"？","options":["一个特别大的物理模型，放在博物馆里展览","用海量数据训练出来的、能理解和生成语言等内容的大型 AI 系统","一种大型积木玩具","一种体积大的电脑"],"answer":[1],"explain":"AI 大模型是用海量数据训练出来的\"超级大脑\"，参数规模常常达到几十亿、几百亿甚至更多。它读过互联网上几乎所有的公开文本，所以能聊天、写代码、画画、做创意。","tip":"DAY3 科大讯飞，你会亲眼看到\"星火大模型\"是怎么生成的。"},{"type":"单选","q":"营地最后两天（DAY5-DAY6）你要完成的\"个人 AI 作品\"是？","options":["抄写一篇 AI 论文","搭建属于自己的 AI 管家或 AI 分身，并公开路演","背一段 AI 定义","画一张 AI 海报"],"answer":[1],"explain":"营地最重要的产出是\"个人 AI 作品\"——在清北级 AI 教练指导下，从创意构思到作品成型，搭建专属 AI 管家 / AI 分身，并在国家大剧院严选五星级会场公开路演。这是带得走的成果，让爸妈真实看见你的成长。","tip":"DAY6 的路演，爸爸妈妈可以来现场看你展示哦！"},{"type":"多选","q":"下面哪些是\"慧用 AI\"的好习惯？（多选）","options":["先自己想清楚问题，再让 AI 帮忙","用 AI 生成的内容要自己核对，因为它可能出错","学习 AI 的思路，而不是只抄它的答案","AI 说什么就信什么，不再思考"],"answer":[0,1,2],"explain":"前 3 项都是\"慧用 AI\"的好习惯：先想再问、独立核对、学思路不抄答案。最后一项是典型的\"乱用 AI\"——AI 会\"幻觉\"（编造看似合理但错误的内容），盲目相信会出大问题。","tip":"这是营地\"一个核心技能\"的全部精髓。"},{"type":"单选","q":"下面哪个最能描述 AI 营地要带给你的\"成长闭环\"？","options":["听 6 天讲座 → 拿个结业证","看 AI 全链路 → 真实科技现场动手 → 搭个人作品 → 公开路演被看见","玩 6 天机器人 → 拍照打卡","背 AI 知识点 → 考试"],"answer":[1],"explain":"营地的成长闭环是：认知（看懂 AI 全链路）→ 实操（5 大科技现场动手）→ 作品（个人 AI 管家/分身）→ 路演（被家长真实看见）。这才是\"通识 AI 第一课\"该有的样子。","tip":"6 天之后，你带回家的不只是伴手礼，还有一个属于自己的 AI 作品。"}];
var currentIdx = 0;
var answers = [];
var answered = [];
var scores = [];
var POINT_PER_Q = 10;
var letters = ['A','B','C','D'];
for(var initI=0; initI<questions.length; initI++){answers.push(null);answered.push(false);scores.push(0);}
function byId(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function hasClass(el,name){return (' '+el.className+' ').indexOf(' '+name+' ')>-1;}
function addClass(el,name){if(!hasClass(el,name)) el.className += (el.className ? ' ' : '') + name;}
function removeClass(el,name){el.className=(' '+el.className+' ').replace(' '+name+' ',' ').replace(/^\s+|\s+$/g,'');}
function getOptions(qIdx){return byId('opts-'+qIdx).getElementsByClassName('option');}
function selectedIndexes(qIdx){var opts=getOptions(qIdx);var arr=[];for(var i=0;i<opts.length;i++){if(hasClass(opts[i],'selected')) arr.push(i);}return arr;}
function arraysEqualAsSet(a,b){if(a.length!==b.length) return false;for(var i=0;i<a.length;i++){var found=false;for(var j=0;j<b.length;j++){if(a[i]===b[j]){found=true;break;}}if(!found) return false;}return true;}
function renderQuestion(idx){var q=questions[idx];var isMulti=q.type==='多选';var html='';html+='<div class="quiz-card active" id="card-'+idx+'">';html+='<div class="q-meta"><span class="q-num">第 '+(idx+1)+' 题</span><span class="q-type">'+esc(q.type)+'</span></div>';html+='<div class="q-text">'+esc(q.q)+'</div>';if(isMulti) html+='<div class="multi-hint">📌 这是多选题，请选出所有正确答案</div>';html+='<div class="options" id="opts-'+idx+'">';for(var i=0;i<q.options.length;i++){html+='<div class="option" data-idx="'+i+'" onclick="selectOpt('+idx+','+i+')"><div class="opt-label">'+letters[i]+'</div><div class="opt-text">'+esc(q.options[i])+'</div></div>';}html+='</div>';html+='<div class="explain" id="explain-'+idx+'"><div class="ex-title">💡 解析</div><div class="ex-text">'+esc(q.explain)+'</div>';if(q.tip) html+='<div class="ex-tip">📍 '+esc(q.tip)+'</div>';html+='</div>';html+='<div class="btn-row"><button class="btn btn-secondary" onclick="prev()" '+(idx===0?'disabled':'')+'>← 上一题</button><button class="btn btn-primary" id="nextBtn-'+idx+'" onclick="next()" disabled>提交答案</button></div>';html+='</div>';return html;}
function selectOpt(qIdx,optIdx){if(answered[qIdx]) return;var q=questions[qIdx];var opts=getOptions(qIdx);if(q.type==='多选'){if(hasClass(opts[optIdx],'selected')) removeClass(opts[optIdx],'selected'); else addClass(opts[optIdx],'selected');}else{for(var i=0;i<opts.length;i++) removeClass(opts[i],'selected');addClass(opts[optIdx],'selected');}byId('nextBtn-'+qIdx).disabled=selectedIndexes(qIdx).length===0;}
function submitAnswer(qIdx){var q=questions[qIdx];var opts=getOptions(qIdx);var selected=selectedIndexes(qIdx);var correct=arraysEqualAsSet(selected,q.answer);for(var i=0;i<opts.length;i++){addClass(opts[i],'disabled');if(q.answer.indexOf(i)>-1) addClass(opts[i],'correct');else if(hasClass(opts[i],'selected')) addClass(opts[i],'wrong');}addClass(byId('explain-'+qIdx),'show');scores[qIdx]=correct?POINT_PER_Q:0;answers[qIdx]=selected;answered[qIdx]=true;var btn=byId('nextBtn-'+qIdx);btn.disabled=false;btn.innerHTML=qIdx===questions.length-1?'查看结果 🎉':'下一题 →';btn.onclick=qIdx===questions.length-1?showResult:next;updateProgress();}
function next(){if(!answered[currentIdx]){submitAnswer(currentIdx);return;}if(currentIdx<questions.length-1){removeClass(byId('card-'+currentIdx),'active');currentIdx++;if(!byId('card-'+currentIdx)){byId('quizContainer').innerHTML+=renderQuestion(currentIdx);}else{addClass(byId('card-'+currentIdx),'active');}updateProgress();window.scrollTo(0, byId('quizContainer').offsetTop-70);}}
function prev(){if(currentIdx>0){removeClass(byId('card-'+currentIdx),'active');currentIdx--;addClass(byId('card-'+currentIdx),'active');updateProgress();window.scrollTo(0, byId('quizContainer').offsetTop-70);}}
function updateProgress(){var fill=((currentIdx+1)/questions.length)*100;byId('progressFill').style.width=fill+'%';byId('progressLabel').innerHTML='第 '+(currentIdx+1)+' 题 / 共 '+questions.length+' 题';var total=0;for(var i=0;i<scores.length;i++) total+=scores[i];byId('scoreLabel').innerHTML='当前得分：'+total+' 分';}
function showResult(){if(!answered[currentIdx]){submitAnswer(currentIdx);setTimeout(showResult,500);return;}removeClass(byId('card-'+currentIdx),'active');var total=0;for(var i=0;i<scores.length;i++) total+=scores[i];byId('finalScore').innerHTML=total;var emoji=byId('resultEmoji'),title=byId('resultTitle'),msg=byId('resultMsg'),badges=byId('resultBadges');if(total>=90){emoji.innerHTML='🏆';title.innerHTML='AI 小达人！';msg.innerHTML='你已经具备非常扎实的 AI 认知，营地来“实战进阶”就对了！DAY5 的个人 AI 作品，期待你的惊艳亮相。';badges.innerHTML='<span class="badge gold">🏅 AI 小达人</span><span class="badge gold">🚀 全链路认知</span>';}else if(total>=70){emoji.innerHTML='🌟';title.innerHTML='AI 优等生！';msg.innerHTML='你对 AI 已经有了不错的理解，营地 6 天会让你从“懂概念”进阶到“能动手”。准备好你的创意，DAY5 搭建专属 AI 管家！';badges.innerHTML='<span class="badge silver">🥈 AI 优等生</span>';}else if(total>=50){emoji.innerHTML='💪';title.innerHTML='AI 探索者！';msg.innerHTML='你已经迈出了认识 AI 的第一步——营地正好是为你设计的“通识 AI 第一课”。6 天之后，你会发现自己原来这么懂 AI！';badges.innerHTML='<span class="badge bronze">🥉 AI 探索者</span>';}else{emoji.innerHTML='🌱';title.innerHTML='AI 新苗！';msg.innerHTML='没关系，每个 AI 大神都是从零开始的。营地就是来帮你打通“AI 全链路认知”的——6 天之后，你一定会让别人刮目相看！';badges.innerHTML='<span class="badge bronze">🌱 AI 新苗</span>';}addClass(byId('resultCard'),'show');window.scrollTo(0, byId('resultCard').offsetTop-18);}
function restart(){currentIdx=0;answers=[];answered=[];scores=[];for(var i=0;i<questions.length;i++){answers.push(null);answered.push(false);scores.push(0);}byId('quizContainer').innerHTML=renderQuestion(0);removeClass(byId('resultCard'),'show');removeClass(byId('reviewPanel'),'show');byId('reviewPanel').innerHTML='';updateProgress();window.scrollTo(0,0);}
function reviewAll(){var html='';for(var i=0;i<questions.length;i++){var q=questions[i];html+='<div class="review-item"><h4>第 '+(i+1)+' 题 · '+esc(q.type)+'：'+esc(q.q)+'</h4>';for(var j=0;j<q.options.length;j++){var mark=q.answer.indexOf(j)>-1?'✓':'&nbsp;';html+='<div style="font-size:13px;color:#4b5563;margin:3px 0;">'+mark+' '+letters[j]+'. '+esc(q.options[j])+'</div>';}var ans=[];for(var k=0;k<q.answer.length;k++) ans.push(letters[q.answer[k]]);html+='<div class="answer-line">正确答案：'+ans.join('、')+'</div><p>'+esc(q.explain)+'</p>';if(q.tip) html+='<p style="font-style:italic;color:#6b7280;">📍 '+esc(q.tip)+'</p>';html+='</div>';}var panel=byId('reviewPanel');panel.innerHTML=html;addClass(panel,'show');window.scrollTo(0,panel.offsetTop-20);}
byId('quizContainer').innerHTML=renderQuestion(0);
byId('restartBtn').onclick=restart;
byId('reviewBtn').onclick=reviewAll;
updateProgress();
</script>
</body>
</html>
